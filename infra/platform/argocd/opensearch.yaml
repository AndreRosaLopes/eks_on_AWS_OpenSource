apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://opensearch-project.github.io/helm-charts
      chart: opensearch
      targetRevision: 3.9.0
      helm:
        valueFiles:
          - $values/infra/platform/apps/opensearch/values.yaml
    - repoURL: https://github.com/AndreRosaLopes/eks_on_AWS_OpenSource
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: openmetadata
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
