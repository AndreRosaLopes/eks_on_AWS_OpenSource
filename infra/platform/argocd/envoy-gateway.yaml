apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.9.2
      helm:
        valueFiles:
          - $values/infra/platform/apps/envoy-gateway/values.yaml
    - repoURL: https://github.com/AndreRosaLopes/eks_on_AWS_OpenSource
      targetRevision: main
      ref: values
    - repoURL: https://github.com/AndreRosaLopes/eks_on_AWS_OpenSource
      targetRevision: main
      path: infra/platform/apps/envoy-gateway/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
