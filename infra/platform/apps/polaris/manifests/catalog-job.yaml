# Creates the Iceberg catalog on the data bucket and the medallion namespaces (D-012, D-030).
# S3 access uses the node role; Polaris vends no credentials (stsUnavailable). Idempotent: an
# existing catalog or namespace answers 409 and is skipped; the catalog properties are then updated.
apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-catalog
  namespace: polaris
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: catalog
          image: curlimages/curl:8.22.0
          env:
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-root
                  key: clientSecret
            - name: BUCKET
              value: data-platform-dev-data-283429977024
          command:
            - sh
            - -c
            - |
              set -eu
              api=http://polaris.polaris.svc:8181/api
              token=$(curl -sf "$api/catalog/v1/oauth/tokens" \
                -d grant_type=client_credentials -d client_id=root \
                -d "client_secret=$CLIENT_SECRET" -d scope=PRINCIPAL_ROLE:ALL \
                | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
              [ -n "$token" ]
              send() {
                code=$(curl -s -o /tmp/out -w '%{http_code}' -X "$1" "$2" \
                  -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$3")
                echo "$1 $2 -> $code"
                case "$code" in 2*|409) ;; *) cat /tmp/out; exit 1 ;; esac
              }
              post() { send POST "$1" "$2"; }
              # Drop with purge is needed by the Airbyte S3 Data Lake destination check.
              properties="{\"default-base-location\":\"s3://$BUCKET/lakehouse\",
                \"polaris.config.drop-with-purge.enabled\":\"true\"}"
              post "$api/management/v1/catalogs" "{\"catalog\":{\"name\":\"lakehouse\",\"type\":\"INTERNAL\",
                \"properties\":$properties,
                \"storageConfigInfo\":{\"storageType\":\"S3\",\"allowedLocations\":[\"s3://$BUCKET/\"],
                \"region\":\"us-east-2\",\"stsUnavailable\":true}}}"
              # An existing catalog gets the current properties.
              version=$(curl -sf "$api/management/v1/catalogs/lakehouse" -H "Authorization: Bearer $token" \
                | sed -n 's/.*"entityVersion":\([0-9]*\).*/\1/p')
              send PUT "$api/management/v1/catalogs/lakehouse" \
                "{\"currentEntityVersion\":$version,\"properties\":$properties}"
              # catalog_admin (granted to the root principal) also reads and writes table data.
              send PUT "$api/management/v1/catalogs/lakehouse/catalog-roles/catalog_admin/grants" \
                '{"grant":{"type":"catalog","privilege":"CATALOG_MANAGE_CONTENT"}}'
              for ns in bronze silver gold; do
                post "$api/catalog/v1/lakehouse/namespaces" "{\"namespace\":[\"$ns\"]}"
              done
