# Creates the Polaris tables and the POLARIS realm with its root credentials (D-014). Runs in the
# Sync phase after PostgreSQL (wave -2) and before the Polaris server (wave 0).
# Idempotent: an already bootstrapped realm is skipped with exit code 0.
apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-bootstrap
  namespace: polaris
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: apache/polaris-admin-tool:1.8.0
          args:
            - bootstrap
            - --realm=POLARIS
            - --credential=POLARIS,root,$(ROOT_CLIENT_SECRET)
          env:
            - name: POLARIS_PERSISTENCE_TYPE
              value: relational-jdbc
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: polaris-db
                  key: jdbcUrl
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: polaris-db
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polaris-db
                  key: password
            - name: ROOT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-root
                  key: clientSecret
