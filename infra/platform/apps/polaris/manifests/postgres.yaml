# PostgreSQL owned by Polaris (D-014); password from the Secret created by the bootstrap apply.
# Sync wave -2: ready before the Polaris bootstrap (wave -1). Polaris does not create its schema,
# so the init script does it on the first start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-postgres-init
  namespace: polaris
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  schema.sql: CREATE SCHEMA IF NOT EXISTS polaris_schema;
---
apiVersion: v1
kind: Service
metadata:
  name: polaris-postgres
  namespace: polaris
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selector:
    app: polaris-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: polaris-postgres
  namespace: polaris
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: polaris-postgres
  replicas: 1
  selector:
    matchLabels:
      app: polaris-postgres
  template:
    metadata:
      labels:
        app: polaris-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - name: POSTGRES_DB
              value: polaris
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: polaris-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polaris-db
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, pg_isready -U "$POSTGRES_USER" -d polaris]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: polaris-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
