# Cluster Autoscaler with auto-discovery of the EKS managed node groups (D-001).
cloudProvider: aws
awsRegion: us-east-2
autoDiscovery:
  clusterName: data-platform-dev

image:
  tag: v1.36.1 # matches Kubernetes 1.36 (D-009)

extraArgs:
  expander: least-waste
  balance-similar-node-groups: true
  skip-nodes-with-local-storage: false
  scale-down-unneeded-time: 5m
  scale-down-delay-after-add: 5m

resources:
  requests:
    cpu: 50m
    memory: 300Mi
