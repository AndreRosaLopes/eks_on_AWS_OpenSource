# OpenSearch 3.x for the OpenMetadata search (D-025): one node, reduced heap, internal access
# only. The security plugin is disabled (the service is reachable only inside the cluster).
singleNode: true
replicas: 1

opensearchJavaOpts: "-Xms1g -Xmx1g"

resources:
  requests:
    cpu: 200m
    memory: 2Gi

persistence:
  enabled: true
  storageClass: gp3
  size: 10Gi

# vm.max_map_count >= 262144 on the node, set by a privileged init container.
sysctlInit:
  enabled: true

extraEnvs:
  - name: DISABLE_SECURITY_PLUGIN
    value: "true"
  - name: DISABLE_INSTALL_DEMO_CONFIG
    value: "true"

config:
  opensearch.yml: |
    cluster.name: opensearch-cluster
    network.host: 0.0.0.0
    plugins.security.disabled: true
