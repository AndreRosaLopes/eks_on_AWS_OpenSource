# Airflow metrics (StatsD exporter of the Airflow chart) and the alert on failed tasks (D-024).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: airflow-statsd
  namespace: observability
spec:
  namespaceSelector:
    matchNames: [airflow]
  selector:
    matchLabels:
      component: statsd
  endpoints:
    - port: statsd-scrape
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: observability
spec:
  groups:
    - name: platform
      rules:
        - alert: AirflowTaskFailed
          expr: sum by (dag_id, task_id) (increase(airflow_ti_failures[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "Airflow task failed: {{ $labels.dag_id }}.{{ $labels.task_id }}"
