# Airbyte (P1): bundled database (D-010), storage on the Airbyte bucket through the node role,
# sync jobs on the Spot group. UI only through kubectl port-forward (FR-004).
global:
  storage:
    type: s3
    bucket:
      log: data-platform-dev-airbyte-283429977024
      state: data-platform-dev-airbyte-283429977024
      workloadOutput: data-platform-dev-airbyte-283429977024
      activityPayload: data-platform-dev-airbyte-283429977024
      auditLogging: data-platform-dev-airbyte-283429977024
    s3:
      region: us-east-2
      authenticationType: instanceProfile

  workloads:
    namespace: airbyte
    # Connector defaults request 1 CPU per container (3 per sync pod), more than one m7g.large node
    # (1.93 CPU allocatable) holds; smaller requests let a sync pod fit on one Spot node.
    resources:
      useConnectorResourceDefaults: false
      mainContainer:
        cpu:
          request: 250m
          limit: "1"
        memory:
          request: 1Gi
          limit: 2Gi
      replication:
        cpu:
          request: 250m
          limit: "1"
        memory:
          request: 1Gi
          limit: 2Gi

  jobs:
    kube:
      namespace: airbyte
      nodeSelector:
        capacity: spot
      tolerations:
        - key: capacity
          operator: Equal
          value: "spot"
          effect: NoSchedule
