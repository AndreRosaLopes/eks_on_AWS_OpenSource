# Internal sample source: PostgreSQL with the MovieLens subset (D-013), reached by Airbyte through
# the cluster DNS name sample-source.sample-source.svc.
apiVersion: v1
kind: Service
metadata:
  name: sample-source
  namespace: sample-source
spec:
  selector:
    app: sample-source
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sample-source
  namespace: sample-source
spec:
  serviceName: sample-source
  replicas: 1
  selector:
    matchLabels:
      app: sample-source
  template:
    metadata:
      labels:
        app: sample-source
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - name: POSTGRES_DB
              value: movielens
            - name: POSTGRES_USER
              value: sample
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sample-source-db
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, pg_isready -U sample -d movielens]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: initdb
          configMap:
            name: sample-source-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
