# PostgreSQL of Metabase (D-018); password from the Secret created by the bootstrap apply.
apiVersion: v1
kind: Service
metadata:
  name: metabase-postgres
  namespace: metabase
spec:
  selector:
    app: metabase-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: metabase-postgres
  namespace: metabase
spec:
  serviceName: metabase-postgres
  replicas: 1
  selector:
    matchLabels:
      app: metabase-postgres
  template:
    metadata:
      labels:
        app: metabase-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - name: POSTGRES_DB
              value: metabase
            - name: POSTGRES_USER
              value: metabase
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metabase-db
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, pg_isready -U metabase -d metabase]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
